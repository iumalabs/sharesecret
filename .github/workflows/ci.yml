name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install
      - run: deno task lint
      - run: deno task format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Deliberately NOT caching ~/.cache/deno here (unlike the other jobs):
      # `deno check`'s own graph cache was observed, during development, to
      # reuse a stale "already validated" result for a file across runs with
      # DIFFERENT effective compilerOptions -- a false-positive risk that's
      # exactly wrong for a security-relevant CI gate. node_modules alone
      # (deterministic from deno.lock) is safe to cache for speed.
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install
      - run: deno task cf-typegen
      - run: deno task typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install
      - run: deno task cf-typegen
      - run: deno task test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install
      - run: deno task cf-typegen
      - run: cp .env.example .dev.vars && sed -i "s/^PIN_HASH_PEPPER=$/PIN_HASH_PEPPER=ci-only-pepper-$(openssl rand -hex 16)/" .dev.vars
      - run: deno task db:migrate:local
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      # Browser binaries restore from cache, but the OS packages they need to
      # actually run (libnss3, libatk, etc.) are installed onto the runner's
      # filesystem, not this cached directory -- every job starts on a fresh
      # VM, so those need reinstalling regardless of the binary cache hit.
      # `install-deps` (no `--with-deps` binary download) is the fast path.
      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: deno run -A npm:playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: deno run -A npm:playwright install-deps chromium
      - run: deno task test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install
      - run: deno task cf-typegen
      - run: deno task build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
