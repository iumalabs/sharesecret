name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A superseded PR run is safe to cancel outright -- nothing external
  # depends on it. A superseded `main` run is not: the deploy job at the
  # bottom of this file runs `wrangler deploy` against production, and
  # cancelling mid-deploy there (rather than just queuing behind it) can
  # leave a partial deployment. Only auto-cancel for non-main refs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install
      - run: deno task lint
      - run: deno task format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Deliberately NOT caching ~/.cache/deno here (unlike the other jobs):
      # `deno check`'s own graph cache was observed, during development, to
      # reuse a stale "already validated" result for a file across runs with
      # DIFFERENT effective compilerOptions -- a false-positive risk that's
      # exactly wrong for a security-relevant CI gate. node_modules alone
      # (deterministic from deno.lock) is safe to cache for speed.
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install
      - run: deno task cf-typegen
      - run: deno task typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install
      - run: deno task cf-typegen
      - run: deno task test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install
      - run: deno task cf-typegen
      - run: cp .env.example .dev.vars && sed -i "s/^PIN_HASH_PEPPER=$/PIN_HASH_PEPPER=ci-only-pepper-$(openssl rand -hex 16)/" .dev.vars
      - run: deno task db:migrate:local
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      # Browser binaries restore from cache, but the OS packages they need to
      # actually run (libnss3, libatk, etc.) are installed onto the runner's
      # filesystem, not this cached directory -- every job starts on a fresh
      # VM, so those need reinstalling regardless of the binary cache hit.
      # `install-deps` (no `--with-deps` binary download) is the fast path.
      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: deno run -A npm:playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: deno run -A npm:playwright install-deps chromium
      - run: deno task test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install
      - run: deno task cf-typegen
      - run: cp .env.example .dev.vars && sed -i "s/^PIN_HASH_PEPPER=$/PIN_HASH_PEPPER=ci-only-pepper-$(openssl rand -hex 16)/" .dev.vars
      - run: deno task db:migrate:local
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: deno run -A npm:playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: deno run -A npm:playwright install-deps chromium
      # Instrumented, single-worker, chromium-only: coverage runs are already
      # a second full pass of the suite on top of the `e2e` job above, and
      # parallel workers were observed to reintroduce the environment
      # contention (shared createSecret-fixture timeouts) that --workers=1
      # avoids -- correctness of the number matters more here than speed.
      - run: deno task test:e2e:coverage:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install
      - run: deno task cf-typegen
      - run: deno task build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploys `main` to production. Gated behind every other job passing, and
  # behind being a push to `main` itself (not a PR -- PRs only ever run the
  # checks above). This is the only path to production: there is no local/
  # manual `deno task deploy` in the intended workflow, so merging to `main`
  # is the actual "ship it" action once this job is green.
  deploy:
    name: deploy
    needs: [lint, typecheck, test, e2e, coverage, build, gitleaks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sharesecret.iuma.dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install
      - run: deno task cf-typegen
      # Applies any migrations added under migrations/ that the live D1
      # database doesn't have yet. A no-op when there's nothing new -- safe
      # to run on every deploy rather than only when a migration was added.
      - name: Apply D1 migrations
        run: deno task db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build and deploy
        run: deno task deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
